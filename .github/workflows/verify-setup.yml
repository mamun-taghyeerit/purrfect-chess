name: Verify setup and build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Ensure Yarn classic (v1)
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            npm i -g yarn@1.22.22
          else
            if ! yarn --version | grep -Eq '^1\.'; then
              npm i -g yarn@1.22.22
            fi
          fi
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: |
          yarn build
          yarn next:build

      - name: Test
        run: yarn test
